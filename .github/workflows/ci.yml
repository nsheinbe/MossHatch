name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:54329/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: node scripts/check-supply-chain.mjs
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: npx vitest run
      - run: npx vitest run packages/api/src/ops/engine.test.ts   # ST-105 wall-clock bounds, alone on an unloaded database
        env:
          MH_PERF: "1"
      - run: node scripts/check-st-ids.mjs
      - run: npm run build   # includes the bundle scan and size budgets
      - run: npm run build:cards   # hatchkind.com (separate Vercel project): secret scan, no-script, links and budgets
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
