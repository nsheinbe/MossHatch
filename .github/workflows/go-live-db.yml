# Owner-run, manual only (docs/GO-LIVE.md steps 4 and 8): applies pending migrations, publishes the legal documents,
# sets the sell gate floor, then (optionally) emails one waitlist invite and (optionally) creates the four Stripe Products checkout
# needs (step 5). The secrets live in GitHub (Settings, Secrets and variables, Actions): DATABASE_URL_OWNER (Neon owner role),
# RESEND_API_KEY and, for the Stripe step, STRIPE_SECRET_KEY (the rk_live_ key). The scripts print names, counts and ids only.
name: go-live database
on:
  workflow_dispatch:
    inputs:
      sell_gate_floor:
        description: "Sell gate floor in cents (500 = USD 5)"
        required: true
        default: "500"
      invite_email:
        description: "Waitlist address to invite (leave empty to skip)"
        required: false
        default: ""
      stripe_catalog:
        description: "Create the Stripe Products checkout needs (idempotent; needs the STRIPE_SECRET_KEY secret)"
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  go-live-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: migrations, documents, sell gate
        env:
          DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
          FLOOR: ${{ inputs.sell_gate_floor }}
        run: node scripts/go-live-db.mjs --sell-gate-floor "$FLOOR"
      - name: invite
        if: ${{ inputs.invite_email != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_OWNER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL: ${{ inputs.invite_email }}
        run: node scripts/waitlist-invite.mjs --email "$EMAIL"
      - name: stripe products
        if: ${{ inputs.stripe_catalog }}
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: node scripts/stripe-catalog.mjs
