# Publishes the CLI (@mosshatch/cli) to npm with trusted publishing and provenance (PLAN 4.5 CLI, ST-141).
# Manual dispatch only, and only from a cli-vX.Y.Z tag: a run started from a branch skips the job entirely.
name: cli-publish
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/cli-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write   # npm trusted publishing (OIDC) and provenance; no npm token is stored anywhere
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:54329/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tag names the package version
        run: test "refs/tags/cli-v$(node -p "require('./packages/cli/package.json').version")" = "$GITHUB_REF"
      - run: node scripts/check-supply-chain.mjs
      - run: npm ci --ignore-scripts
      - run: npm run typecheck -w @mosshatch/cli
      - run: npx vitest run packages/cli packages/api/src/bindings
      - run: npm run build -w @mosshatch/cli
      - name: Publish the SHA-256 of the bundle
        run: cat packages/cli/dist/mosshatch.mjs.sha256 >> "$GITHUB_STEP_SUMMARY"
      - run: npm publish -w @mosshatch/cli --provenance --access public --ignore-scripts=false
